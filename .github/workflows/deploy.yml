name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-hosting-production-deploy
  cancel-in-progress: false

jobs:
  checks-and-deploy:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      deploy: true
    secrets: inherit
