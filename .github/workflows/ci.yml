name: Checks

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false
    secrets:
      SERVER_HOST:
        required: false
      SERVER_USER:
        required: false
      SERVER_SSH_KEY:
        required: false
      SERVER_FINGERPRINT:
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Go, Nginx and deployment behavior on Linux
        run: docker build --target test -t report-hosting-test .

      - name: Build and smoke-test the release binary
        run: |
          set -euo pipefail
          docker build --target binary --output type=local,dest=out .
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            report-hosting-test bash /src/deploy/scripts/app-smoke.sh /src/out/report_hosting
          (cd out && sha256sum report_hosting > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: report-hosting-${{ github.sha }}
          path: |
            out/report_hosting
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Require deploy secrets
        if: ${{ inputs.deploy && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_FINGERPRINT: ${{ secrets.SERVER_FINGERPRINT }}
        run: |
          set -euo pipefail
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY SERVER_FINGERPRINT; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure the $name repository secret for visionp/report-hosting."
              exit 1
            fi
          done

      - name: Transfer the verified binary
        if: ${{ inputs.deploy && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          source: out/report_hosting,out/SHA256SUMS
          strip_components: 1
          target: /opt/report-hosting/releases/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 120s
          command_timeout: 5m

      - name: Install and verify the release
        if: ${{ inputs.deploy && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          command_timeout: 10m
          script: |
            set -eu
            sudo -n /usr/local/sbin/report-hosting-deploy '${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}'
