# Install this snippet as /etc/nginx/report_hosting.d/tls.conf.
ssl_certificate /etc/report_hosting/tls/origin.pem;
ssl_certificate_key /etc/report_hosting/tls/origin.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_client_certificate /etc/report_hosting/tls/zone-client-ca.pem;
ssl_verify_client on;
ssl_verify_depth 2;
