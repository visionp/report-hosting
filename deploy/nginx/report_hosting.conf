# Include from nginx's http {} context. Install snippets under
# /etc/nginx/report_hosting.d/. No default_server: this VPS is shared.
limit_req_zone $binary_remote_addr zone=report_hosting_upload:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=report_hosting_sites:10m rate=30r/s;
log_format report_hosting '$remote_addr $host "$request_method $uri" $status $body_bytes_sent';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.partnersflex.space;
    include /etc/nginx/report_hosting.d/tls.conf;
    include /etc/nginx/report_hosting.d/cloudflare-realip.conf;
    access_log /var/log/nginx/report_hosting-access.log report_hosting;
    if ($ssl_server_name != $host) { return 421; }
    if ($ssl_client_verify != SUCCESS) { return 403; }
    client_max_body_size 55m;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "private, no-store" always;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Cache-Control;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    location ~ ^/(api/)?sites/[^/]+/deploy$ {
        limit_req zone=report_hosting_upload burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5193;
    }
    location / { proxy_pass http://127.0.0.1:5193; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^(?<slug>[a-z0-9-]+)\.partnersflex\.space$;
    include /etc/nginx/report_hosting.d/tls.conf;
    include /etc/nginx/report_hosting.d/cloudflare-realip.conf;
    access_log /var/log/nginx/report_hosting-access.log report_hosting;
    if ($ssl_server_name != $host) { return 421; }
    if ($ssl_client_verify != SUCCESS) { return 403; }
    root /var/lib/report_hosting/by-slug/$slug/current;
    # Test the full trusted prefix: a shorter by-slug path is itself a managed
    # symlink and disable_symlinks would reject it before authentication.
    if (!-d $document_root) { return 404; }
    index index.html;
    auth_basic "Protected site";
    auth_basic_user_file /var/lib/report_hosting/by-slug/$slug/.htpasswd;
    disable_symlinks on from=$document_root;
    open_file_cache off;
    limit_req zone=report_hosting_sites burst=60 nodelay;
    limit_req_status 429;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    location ~ (^|/)\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}

# Regex order matters: this catches deeper/invalid project names after sites.
# Never replace this with *.partnersflex.space, which outranks site regexes.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name partnersflex.space ~^.+\.partnersflex\.space$;
    include /etc/nginx/report_hosting.d/tls.conf;
    if ($ssl_server_name != $host) { return 421; }
    if ($ssl_client_verify != SUCCESS) { return 403; }
    add_header Cache-Control "private, no-store" always;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name partnersflex.space ~^.+\.partnersflex\.space$;
    return 308 https://$host$request_uri;
}
