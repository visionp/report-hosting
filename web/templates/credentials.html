{{define "title"}}{{.Title}}{{end}}
{{define "workspace-page"}}
  <div class="form-page">
    <div class="page-heading"><h1>{{.Title}}</h1></div>
    <section class="surface form-panel credentials-panel" aria-label="Website access">
      {{template "form-error" .Error}}
      <h2>{{.Site.Name}}</h2>
      <p class="site-url">{{.Site.Slug}}.{{.BaseDomain}}</p>
      <dl class="credentials">
        <dt>Username</dt>
        <dd>{{.Site.AuthUsername}}</dd>
        <dt>Password</dt>
        <dd>
          <button type="button" class="generated-password" data-copy-password title="Copy password">
            <span class="generated-password-value">{{.Password}}</span>
            <svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg>
          </button>
          <p id="password-copy-status" class="copy-status" role="status" aria-live="polite"></p>
        </dd>
      </dl>
      <p class="credential-hint"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg> Hover or click the password to copy it. It is shown only once.</p>
      <a class="button primary" href="/sites/{{.Site.ID}}">Continue to website <svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></a>
    </section>
  </div>
  <script src="/static/copy-password.js" defer></script>
{{end}}
